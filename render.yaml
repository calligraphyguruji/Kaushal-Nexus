# ==============================================================================
# KaushalNexus Platform - Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
# One-click deployment for:
# 1. Managed PostgreSQL Database (kaushalnexus-db)
# 2. Hardened FastAPI Backend Web Service (kaushalnexus-backend)
# 3. Optimized React 19 + Tailwind SPA Static Site (kaushalnexus-frontend)
# ==============================================================================

databases:
  - name: kaushalnexus-db
    databaseName: kaushalnexus_db
    user: kaushal_admin
    plan: free
    ipAllowList: []

services:
  # ============================================================================
  # 1. FastAPI Backend Web Service (Dockerized)
  # ============================================================================
  - type: web
    name: kaushalnexus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "KaushalNexus API"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: AUTO_MIGRATE
        value: "true"
      - key: SEED_DB
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kaushalnexus-db
          property: connectionString
      - key: EXTERNAL_INTEGRATION_MODE
        value: mock
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_API_KEY
        sync: false

  # ============================================================================
  # 2. React Vite Frontend (Static Site)
  # ============================================================================
  - type: static
    name: kaushalnexus-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kaushalnexus-backend
          envVarKey: RENDER_EXTERNAL_URL
